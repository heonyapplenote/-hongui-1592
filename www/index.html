<style>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
let dtGlobal = 0.016;
const Store = {
  data: { coins: 0, upgrades: { start: 0, coin: 0 }, cleared: [] },
  load() { try { const d = JSON.parse(localStorage.getItem('hongui1592')); if (d) this.data = Object.assign(this.data, d); } catch(e){} },
  save() { try { localStorage.setItem('hongui1592', JSON.stringify(this.data)); } catch(e){} }
};
const Sound = {
  ctx: null, enabled: true,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(freq, dur, type='square', vol=0.08) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  coin() { this.play(880,0.08,'triangle',0.12); setTimeout(()=>this.play(1320,0.12,'triangle',0.12), 60); },
  gate() { this.play(523,0.06,'square',0.1); this.play(784,0.08,'square',0.08); },
  win() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.play(f,0.18,'triangle',0.14), i*90)); },
  lose() { this.play(196,0.5,'sawtooth',0.1); },
  hit() { this.play(150,0.05,'square',0.05); }
};
const STAGES = [

class Renderer3D {
  constructor(canvas) {
    this.renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.1;
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0xd8c3a5, 0.02);
    this.world = new THREE.Group();
    this.scene.add(this.world);
    this.camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
    this.camera.position.set(0, 8, 12);
    this.camera.lookAt(0, 0, -5);
    this.setupLights();
    this.setupGround();
    this.setupPost();
    addEventListener('resize', () => {
      this.camera.aspect = innerWidth/innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
      if (this.composer) this.composer.setSize(innerWidth, innerHeight);
    });
  }
  setupLights() {
    const hemi = new THREE.HemisphereLight(0xffeeb1, 0x080820, 1.2);
    this.scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff2d9, 2.2);
    sun.position.set(15, 25, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
    sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
    sun.shadow.camera.far = 60;
    sun.shadow.bias = -0.0002;
    this.scene.add(sun);
  }
  setupGround() {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#b09a72'; ctx.fillRect(0,0,512,512);
    for (let i=0;i<4000;i++){
      ctx.fillStyle = `rgba(${80+Math.random()*60|0},${70+Math.random()*50|0},${50+Math.random()*40|0},0.25)`;
      ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*512, 1+Math.random()*3, 0, 6.28); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(8, 40);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 200),
      new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0 })
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.z = -80;
    ground.receiveShadow = true;
    this.scene.add(ground);
  }
  setupPost() {
    try {
      this.composer = new THREE.EffectComposer(this.renderer);
      this.composer.addPass(new THREE.RenderPass(this.scene, this.camera));
      const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.4, 0.85);
      this.composer.addPass(bloom);
    } catch(e) { this.composer = null; }
  }
  render() {
    if (this.composer) this.composer.render();
    else this.renderer.render(this.scene, this.camera);
  }
}
function makeTextPanel(text, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f3ead6'; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle = '#241f1a'; ctx.lineWidth = 12; ctx.strokeRect(6,6,244,244);
  ctx.fillStyle = color; ctx.font = '900 110px Jua, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
  return new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.2), mat);
}
class Army {
  constructor(scene, max, isEnemy, parent) {
    this.max = max; this.count = 0; this.isEnemy = isEnemy;
    this.dummy = new THREE.Object3D();
    this.pos = new THREE.Vector3();
    const bodyMat = new THREE.MeshStandardMaterial({
      color: isEnemy ? 0x2a2a2a : 0xc23b22,
      roughness: 0.7, metalness: 0.15
    });
    const hatMat = new THREE.MeshStandardMaterial({
      color: isEnemy ? 0x111111 : 0x241f1a,
      roughness: 0.4, metalness: 0.6
    });
    const bodyGeo = new THREE.CapsuleGeometry(0.3, 0.9, 4, 8);
    const hatGeo = isEnemy
      ? new THREE.ConeGeometry(0.35, 0.5, 6)
      : new THREE.CylinderGeometry(0.45, 0.45, 0.12, 12);
    this.bodies = new THREE.InstancedMesh(bodyGeo, bodyMat, max);
    this.hats = new THREE.InstancedMesh(hatGeo, hatMat, max);
    this.bodies.castShadow = this.hats.castShadow = true;
    this.bodies.frustumCulled = this.hats.frustumCulled = false;
    parent.add(this.bodies, this.hats);
    this.offsets = [];
    for (let i=0;i<max;i++){
      const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random());
      this.offsets.push({x: Math.cos(a)*r, z: Math.sin(a)*r, ph: Math.random()*10});
    }
    this.setCount(0);
  }
  setCount(n) { this.count = Math.max(0, Math.min(this.max, Math.floor(n))); }
  update(dt, time) {
    this.bodies.count = this.count;
    this.hats.count = this.count;
    for (let i=0; i<this.count; i++) {
      const o = this.offsets[i];
      const spread = 2 + Math.sqrt(this.count)*0.12;
      const x = this.pos.x + o.x * spread;
      const z = this.pos.z + o.z * spread * 0.7;
      const y = Math.abs(Math.sin(time*8 + o.ph)) * 0.15;
      const baseY = y + 0.45;
      this.dummy.position.set(x, baseY, z);
      this.dummy.rotation.set(0, this.isEnemy ? Math.PI : 0, 0);
      this.dummy.scale.set(1,1,1);
      this.dummy.updateMatrix();
      this.bodies.setMatrixAt(i, this.dummy.matrix);
      this.dummy.position.y = baseY + 0.75;
      this.dummy.updateMatrix();
      this.hats.setMatrixAt(i, this.dummy.matrix);
    }
    this.bodies.instanceMatrix.needsUpdate = true;
    this.hats.instanceMatrix.needsUpdate = true;
  }
}
class Gate {
  constructor(parent, opL, valL, opR, valR, z) {
    this.group = new THREE.Group();
    this.group.position.z = z;
    const makePanel = (op, val, x) => {
      const txt = op === 'x' ? `×${val}` : `+${val}`;
      const color = op === 'x' ? '#b8862a' : '#2f6fd6';
      const panel = makeTextPanel(txt, color);
      panel.position.x = x;
      panel.position.y = 1.8;
      panel.castShadow = true;
      this.group.add(panel);
      return panel;
    };
    makePanel(opL, valL, -2);
    makePanel(opR, valR, 2);
    const postGeo = new THREE.CylinderGeometry(0.15, 0.15, 4, 8);
    const postMat = new THREE.MeshStandardMaterial({color: 0x6b4a2f, roughness: 0.9});
    const postL = new THREE.Mesh(postGeo, postMat); postL.position.set(-3.5, 2, 0); postL.castShadow = true;
    const postR = postL.clone(); postR.position.x = 3.5;
    this.group.add(postL, postR);
    parent.add(this.group);
    this.active = true;
    this.left = {op: opL, val: valL};
    this.right = {op: opR, val: valR};
  }
  update(z) { this.group.position.z = z; }
}
class Boss {
  constructor(parent, z) {
    this.group = new THREE.Group();
    this.group.position.z = z;
    const bodyMat = new THREE.MeshStandardMaterial({color: 0x1a1a1a, roughness: 0.4, metalness: 0.7});
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 1.8, 6, 12), bodyMat);
    body.position.y = 1.2; body.castShadow = true;
    const helmet = new THREE.Mesh(new THREE.ConeGeometry(0.7, 0.9, 8), new THREE.MeshStandardMaterial({color: 0x000000, metalness: 0.8, roughness: 0.3}));
    helmet.position.y = 2.6;
    const cape = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.2), new THREE.MeshStandardMaterial({color: 0x4a1414, side: THREE.DoubleSide, roughness: 0.8}));
    cape.position.set(0, 1.2, -0.5); cape.rotation.x = -0.2;
    this.group.add(body, helmet, cape);
    parent.add(this.group);
    this.hp = 100; this.maxHp = 100;
    this.dps = 10;
    this.name = '적장';
  }
  update(z, time) {
    this.group.position.z = z;
    this.group.rotation.y = Math.sin(time*2)*0.1;
  }
}
const Game = {
  state: 'menu',
  coins: 0,
  stageIndex: 0,
  progress: 0,
  speed: 6,
  playerX: 0,
  playerTargetX: 0,
  soldiers: 0,
  enemy: null,
  boss: null,
  eventQueue: [],
  filmMode: false,
  camAngle: 0,
  renderer: null,
  world: null,
  init() {
    Store.load();
    this.coins = Store.data.coins;
    this.upgrades = Store.data.upgrades;
    this.cleared = Store.data.cleared;
    this.buildUI();
  },
  startSoldiers() { return 10 + this.upgrades.start * 5; },
  coinMult() { return 1 + this.upgrades.coin * 0.25; },
  buildUI() {
    const list = $('stageList');
    list.innerHTML = '';
    STAGES.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const done = this.cleared.includes(i);
      const locked = i > 0 && !this.cleared.includes(i-1);
      btn.className = done ? 'done' : (locked ? 'locked' : '');
      btn.innerHTML = `<span>${s.name}</span><small>${locked ? '잠김' : (done ? '클리어' : '도전')}</small>`;
      btn.disabled = locked;
      btn.onclick = () => { $('menu').hidden = true; this.startStage(i); };
      list.appendChild(btn);
    });
    $('menuCoins').textContent = this.coins;
    const upS = $('upStart'), upC = $('upCoin');
    const costS = Math.floor(100 * Math.pow(2, this.upgrades.start));
    const costC = Math.floor(150 * Math.pow(2, this.upgrades.coin));
    upS.innerHTML = `시작 병력 +5 <small>현재 ${this.startSoldiers()}명 / ${costS}냥</small>`;
    upC.innerHTML = `엽전 배율 +25% <small>현재 ×${this.coinMult().toFixed(2)} / ${costC}냥</small>`;
    upS.disabled = this.coins < costS;
    upC.disabled = this.coins < costC;
    upS.onclick = () => {
      if (this.coins >= costS) {
        this.coins -= costS;
        this.upgrades.start++;
        Store.data.coins = this.coins;
        Store.save();
        this.buildUI();
        Sound.coin();
      }
    };
    upC.onclick = () => {
      if (this.coins >= costC) {
        this.coins -= costC;
        this.upgrades.coin++;
        Store.data.coins = this.coins;
        Store.save();
        this.buildUI();
        Sound.coin();
      }
    };
    $('btnFilm').textContent = `광고 촬영 모드: ${this.filmMode ? '켜짐' : '꺼짐'}`;
  },
  startStage(i) {
    this.stageIndex = i;
    this.state = 'running';
    this.progress = 0;
    this.playerX = 0; this.playerTargetX = 0;
    this.soldiers = this.startSoldiers();
    this.enemy = null; this.boss = null;
    this.eventQueue = STAGES[i].events.map((e, idx) => ({...e, z: 30 + idx * 18, spawned: false, active: true, obj: null}));
    this.world.clear();
    showBanner(STAGES[i].name, STAGES[i].sub);
    $('hud').hidden = false; $('bar').hidden = false; $('hint').hidden = false;
    setTimeout(()=>$('hint').hidden = true, 3000);
    updateHUD();
  },
  applyGate(op, val) {
    if (op === '+') this.soldiers += val;
    else if (op === 'x') this.soldiers *= val;
    this.soldiers = Math.min(this.soldiers, armyPlayer.max);
    floatText(op === '+' ? `+${val}` : `×${val}`, op === '+' ? '#2f6fd6' : '#b8862a');
    updateHUD();
  },
  update(dt, time) {
    if (this.filmMode) {
      this.camAngle += dt * 0.3;
      const r = 14;
      camera.position.set(Math.sin(this.camAngle)*r, 6 + Math.sin(this.camAngle*0.5)*2, Math.cos(this.camAngle)*r - 5);
      camera.lookAt(0, 1, -5);
      if (this.state === 'running') this.playerTargetX = Math.sin(time*0.5)*2;
    }
    if (this.state === 'running') {
      this.progress += this.speed * dt;
      const maxZ = this.eventQueue.length ? Math.max(...this.eventQueue.map(e=>e.z)) : 0;
      for (const ev of this.eventQueue) {
        const z = ev.z - this.progress;
        if (!ev.spawned) {
          ev.spawned = true;
          if (ev.type === 'gate') {
            ev.obj = new Gate(this.world, ev.l[0], ev.l[1], ev.r[0], ev.r[1], z);
          } else if (ev.type === 'enemy') {
            ev.obj = new Army(scene, 300, true, this.world);
            ev.obj.setCount(ev.count);
            ev.obj.pos.set(0, 0, z);
          } else if (ev.type === 'boss') {
            ev.obj = new Boss(this.world, z);
            ev.obj.hp = ev.obj.maxHp = ev.hp;
            ev.obj.dps = ev.dps;
            ev.obj.name = ev.name;
          }
        }
        if (ev.obj) {
          if (ev.type === 'gate') ev.obj.update(z);
          else if (ev.type === 'enemy') ev.obj.pos.z = z;
          else if (ev.type === 'boss') ev.obj.update(z, time);
        }
        if (ev.type === 'gate' && ev.active && z < 1 && z > -1) {
          ev.active = false;
          const chosen = this.playerX < 0 ? ev.l : ev.r;
          this.applyGate(chosen[0], chosen[1]);
          Sound.gate();
        }
        if (ev.type === 'enemy' && ev.active && z < 6) {
          ev.active = false;
          this.enemy = ev;
          this.state = 'battle';
          showBanner('적군과 조우!', '군사들이 자동으로 싸웁니다');
          Sound.hit();
        }
        if (ev.type === 'boss' && ev.active && z < 8) {
          ev.active = false;
          this.boss = ev;
          this.state = 'battle';
          showBanner(ev.name, '적장 등장! 무찔러라!');
          Sound.hit();
        }
      }
      if (this.progress > maxZ + 20) {
        this.winStage();
        return;
      }
      this.playerX = lerp(this.playerX, this.playerTargetX, dt*8);
      armyPlayer.pos.set(this.playerX, 0, 0);
      armyPlayer.setCount(this.soldiers);
      armyPlayer.update(dt, time);
      if (!this.filmMode) {
        camera.position.x = lerp(camera.position.x, this.playerX*0.4, dt*5);
        camera.position.y = 8; camera.position.z = 12;
        camera.lookAt(this.playerX*0.2, 0, -5);
      }
      const total = maxZ + 20;
      $('barFill').style.width = clamp(this.progress/total*100, 0, 100) + '%';
    }
    else if (this.state === 'battle') {
      if (this.enemy) {
        const e = this.enemy;
        const armyDPS = this.soldiers * 4;
        const enemyDPS = e.count * 3.5;
        e.count -= armyDPS * dt;
        this.soldiers -= enemyDPS * dt;
        if (e.count <= 0) {
          e.count = 0;
          this.enemy = null;
          this.state = 'running';
          showBanner('승리!', '적군을 물리쳤습니다');
          Sound.win();
        }
        if (this.soldiers <= 0) { this.loseStage(); return; }
        e.obj.setCount(e.count);
        e.obj.pos.z = lerp(e.obj.pos.z, 2, dt*2);
        e.obj.update(dt, time);
      } else if (this.boss) {
        const b = this.boss;
        const armyDPS = this.soldiers * 5;
        b.obj.hp -= armyDPS * dt;
        this.soldiers -= b.obj.dps * dt;
        b.timer = (b.timer || 0) + dt;
        if (b.timer > 3) {
          b.timer = 0;
          this.soldiers -= this.soldiers * 0.15;
          floatText('보스 휩쓸기!', '#c22a2a');
          Sound.play(120, 0.3, 'sawtooth', 0.15);
        }
        if (b.obj.hp <= 0) {
          b.obj.hp = 0;
          b.obj.group.visible = false;
          this.boss = null;
          this.state = 'running';
          showBanner('적장 처치!', '위대한 승리입니다');
          Sound.win();
        }
        if (this.soldiers <= 0) { this.loseStage(); return; }
        b.obj.update(b.obj.group.position.z, time);
      }
      armyPlayer.pos.set(this.playerX, 0, 0);
      armyPlayer.setCount(this.soldiers);
      armyPlayer.update(dt, time);
    }
    updateTags();
  },
  winStage() {
    this.state = 'result';
    const base = 50 + this.stageIndex * 30;
    const earn = Math.floor(base * this.coinMult());
    this.coins += earn;
    Store.data.coins = this.coins;
    if (!this.cleared.includes(this.stageIndex)) this.cleared.push(this.stageIndex);
    Store.save();
    showEnd(true, earn);
    Sound.win();
  },
  loseStage() {
    this.state = 'result';
    const earn = Math.floor(10 * this.coinMult());
    this.coins += earn;
    Store.data.coins = this.coins;
    Store.save();
    showEnd(false, earn);
    Sound.lose();
  }
};
function updateHUD() {
  $('hudCoins').textContent = Game.coins;
  $('hudStage').textContent = STAGES[Game.stageIndex].name;
}
function showBanner(name, sub) {
  $('bannerName').textContent = name;
  $('bannerSub').textContent = sub;
  const b = $('banner');
  b.classList.remove('go');
  void b.offsetWidth;
  b.classList.add('go');
}
function floatText(txt, color) {
  const el = $('floatTxt');
  el.textContent = txt;
  el.style.color = color;
  el.classList.remove('go');
  void el.offsetWidth;
  el.classList.add('go');
}
function showEnd(win, earn) {
  $('endScreen').hidden = false;
  $('endTitle').textContent = win ? '대승!' : '패배...';
  $('endTitle').style.color = win ? 'var(--blue)' : 'var(--red)';
  $('endCount').textContent = Math.ceil(Game.soldiers);
  $('endText').textContent = win ? '의병의 함성이 하늘을 울립니다!' : '군사들이 흩어졌습니다. 다시 모여 복수하세요!';
  $('endEarn').textContent = `엽전 +${earn}냥`;
  $('endFact').textContent = STAGES[Game.stageIndex].fact;
  $('btnNext').hidden = !(win && Game.stageIndex < STAGES.length - 1);
  $('endFps').textContent = 'FPS: ' + Math.round(1/Math.max(dtGlobal, 0.001));
}
function toScreen(v) {
  const vec = v.clone().project(camera);
  return { x: (vec.x*0.5+0.5)*innerWidth, y: (-vec.y*0.5+0.5)*innerHeight };
}
function updateTags() {
  const me = $('meTag');
  if (Game.soldiers > 0 && (Game.state === 'running' || Game.state === 'battle')) {
    const pos = toScreen(new THREE.Vector3(armyPlayer.pos.x, armyPlayer.pos.y + 2.5, armyPlayer.pos.z));
    me.hidden = false;
    me.style.left = pos.x + 'px';
    me.style.top = pos.y + 'px';
    me.textContent = Math.ceil(Game.soldiers);
  } else {
    me.hidden = true;
  }
  const foeBox = $('foeTags');
  foeBox.innerHTML = '';
  if (Game.enemy && Game.enemy.count > 0) {
    const pos = toScreen(new THREE.Vector3(Game.enemy.obj.pos.x, Game.enemy.obj.pos.y + 2.5, Game.enemy.obj.pos.z));
    const tag = document.createElement('div');
    tag.className = 'tag foe';
    tag.style.left = pos.x + 'px';
    tag.style.top = pos.y + 'px';
    tag.textContent = Math.ceil(Game.enemy.count);
    foeBox.appendChild(tag);
  }
  if (Game.boss && Game.boss.obj.hp > 0) {
    const pos = toScreen(new THREE.Vector3(Game.boss.obj.group.position.x, Game.boss.obj.group.position.y + 3.5, Game.boss.obj.group.position.z));
    const tag = document.createElement('div');
    tag.className = 'tag boss';
    tag.style.left = pos.x + 'px';
    tag.style.top = pos.y + 'px';
    tag.textContent = `${Game.boss.obj.name} ${Math.ceil(Game.boss.obj.hp)}`;
    foeBox.appendChild(tag);
  }
}
window.addEventListener('load', () => {
  if (!window.THREE) { alert('Three.js를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }
  initGame();
});
function initGame() {
  const canvas = $('game');
  const renderer = new Renderer3D(canvas);
  window.renderer = renderer;
  window.scene = renderer.scene;
  window.camera = renderer.camera;
  window.world = renderer.world;
  window.armyPlayer = new Army(scene, 600, false, scene);
  Game.renderer = renderer;
  Game.world = world;
  Game.init();
  let dragging = false, startX = 0, startPlayerX = 0;
  canvas.addEventListener('pointerdown', e => {
    dragging = true; startX = e.clientX; startPlayerX = Game.playerTargetX;
    Sound.init();
    e.preventDefault();
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = (e.clientX - startX) * 0.02;
    Game.playerTargetX = clamp(startPlayerX + dx, -3, 3);
  });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointercancel', () => dragging = false);
  $('btnSound').onclick = () => { Sound.enabled = !Sound.enabled; $('btnSound').textContent = Sound.enabled ? '소리 켜짐' : '소리 꺼짐'; };
  $('btnFilm').onclick = () => { Game.filmMode = !Game.filmMode; Game.buildUI(); document.body.classList.toggle('film', Game.filmMode); };
  $('btnAgain').onclick = () => { $('endScreen').hidden = true; Game.startStage(Game.stageIndex); };
  $('btnMenu').onclick = () => { $('endScreen').hidden = true; $('menu').hidden = false; Game.state = 'menu'; Game.filmMode = false; document.body.classList.remove('film'); Game.buildUI(); };
  $('btnNext').onclick = () => { $('endScreen').hidden = true; Game.startStage(Game.stageIndex + 1); };
  let lastTime = performance.now();
  function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.05);
    dtGlobal = dt;
    const time = now * 0.001;
    Game.update(dt, time);
    renderer.render();
  }
  requestAnimationFrame(loop);
}
</script>
</body>
